name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # validate escribe content/index.generated.ts, que typecheck y test necesitan.
      - run: npm run validate
      - run: npm run typecheck
      - run: npm test
