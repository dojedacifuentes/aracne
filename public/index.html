<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /* El soporte existe antes que React: nunca hay destello blanco. */
        background-color: #0e0d0c;
        margin: 0;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0e0d0c;
      }
      /* El fondo cubre también el área bajo las barras del navegador móvil. */
      html {
        background-color: #0e0d0c;
      }
      /*
        La barra de desplazamiento, con los colores de la paleta: el hilo es
        `--line` y al pasar por encima sube a `--dim`. No hay color nuevo.

        Estaba escondida en las tres columnas, y una columna que se puede
        recorrer sin decirlo no se recorre: nadie baja a lo que no sabe que
        está. Fina, del color de los filetes, es un instrumento más.
      */
      * {
        scrollbar-width: thin;
        scrollbar-color: #2a2724 transparent;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #2a2724;
        border: 3px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #8a857d;
      }
      /*
        El paquete pesa 1,8 MB y hasta que arranca no hay nada que mirar.
        Esta marca ocupa ese hueco y desaparece sola: en cuanto React monta
        algo dentro, #root deja de estar vacío y el pseudoelemento se va. Sin
        JavaScript, sin animación y sin un solo byte de bundle.
      */
      #root:empty::before {
        content: 'aracne';
        margin: auto;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 2.4px;
        color: #8a857d;
      }
    </style>
  </head>

  <body>
    <noscript>aracne necesita javascript.</noscript>
    <div id="root"></div>
  </body>
</html>
